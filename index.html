<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#cfcfc3" />
    <meta
      name="description"
      content="Archie Serrano's social links."
    />
    <title>Archie Serrano</title>
    <style>
      :root {
        --canvas: #d6d6c9;
        --card: #eeeee7;
        --ink: #171a19;
        --olive: #465147;
        --olive-light: #7c887b;
        --gold: #d48f40;
        --soft: #72776e;
        --line: rgba(23, 26, 25, 0.17);
        --photo: url("./profile.jpg");
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--canvas);
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 10% 8%, rgba(255, 255, 255, 0.78), transparent 24rem),
          radial-gradient(circle at 90% 94%, rgba(70, 81, 71, 0.16), transparent 24rem),
          repeating-linear-gradient(0deg, rgba(23, 26, 25, 0.025) 0 1px, transparent 1px 5px),
          var(--canvas);
      }

      .page {
        display: grid;
        width: min(100% - 28px, 920px);
        min-height: 100vh;
        margin: 0 auto;
        place-items: center;
        padding: 30px 0;
      }

      .card {
        display: grid;
        width: 100%;
        grid-template-columns: minmax(280px, 0.95fr) minmax(320px, 1.05fr);
        overflow: hidden;
        border: 1px solid rgba(23, 26, 25, 0.22);
        border-radius: 28px;
        background: var(--card);
        box-shadow:
          0 28px 80px rgba(23, 26, 25, 0.22),
          14px 14px 0 rgba(70, 81, 71, 0.15);
      }

      .portrait {
        position: relative;
        min-height: 650px;
        overflow: hidden;
        background:
          linear-gradient(160deg, rgba(70, 81, 71, 0.03), rgba(23, 26, 25, 0.58)),
          var(--photo) center 30% / cover;
      }

      .portrait::before {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(110deg, transparent 25%, rgba(255, 214, 151, 0.22), transparent 65%),
          linear-gradient(180deg, transparent 55%, rgba(15, 20, 18, 0.55));
        content: "";
        mix-blend-mode: screen;
      }

      .portrait::after {
        position: absolute;
        inset: 16px;
        border: 1px solid rgba(238, 238, 231, 0.45);
        border-radius: 18px;
        content: "";
      }

      .portrait-label {
        position: absolute;
        top: 28px;
        left: 28px;
        z-index: 1;
        color: rgba(238, 238, 231, 0.85);
        font-size: 0.65rem;
        font-weight: 900;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        writing-mode: vertical-rl;
      }

      .portrait-mark {
        position: absolute;
        right: 28px;
        bottom: 28px;
        z-index: 1;
        width: 36px;
        height: 36px;
        border: 1px solid rgba(238, 238, 231, 0.72);
        border-radius: 50%;
      }

      .portrait-mark::after {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--gold);
        box-shadow: 0 0 14px var(--gold);
        content: "";
        transform: translate(-50%, -50%);
      }

      .content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 650px;
        padding: clamp(32px, 7vw, 70px);
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 22px;
        color: var(--olive);
        font-size: 0.68rem;
        font-weight: 900;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 26px;
        height: 1px;
        background: var(--gold);
        content: "";
      }

      h1 {
        max-width: 400px;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(3.2rem, 9vw, 6rem);
        font-weight: 400;
        letter-spacing: -0.09em;
        line-height: 0.82;
      }

      h1 span {
        display: block;
        color: var(--olive);
        font-style: italic;
      }

      .line {
        width: 100%;
        height: 1px;
        margin: 32px 0 21px;
        background: linear-gradient(90deg, var(--ink), transparent);
      }

      .links {
        display: grid;
        gap: 11px;
      }

      .link {
        display: flex;
        align-items: center;
        gap: 13px;
        min-height: 68px;
        padding: 9px 14px 9px 10px;
        color: var(--ink);
        text-decoration: none;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.52);
        transition:
          transform 180ms ease,
          background 180ms ease,
          box-shadow 180ms ease;
      }

      .link:hover,
      .link:focus-visible {
        background: rgba(124, 136, 123, 0.22);
        box-shadow: 8px 8px 0 rgba(212, 143, 64, 0.14);
        outline: none;
        transform: translate(-3px, -3px);
      }

      .icon {
        display: grid;
        width: 44px;
        height: 44px;
        flex: 0 0 44px;
        place-items: center;
        border-radius: 12px;
        color: var(--card);
        background: var(--olive);
      }

      .link:nth-child(2) .icon {
        background: var(--gold);
      }

      .link:nth-child(3) .icon {
        background: var(--ink);
      }

      .icon svg {
        width: 21px;
        height: 21px;
        fill: currentColor;
      }

      .copy {
        display: grid;
        gap: 3px;
        min-width: 0;
      }

      .copy strong {
        font-size: 0.96rem;
        font-weight: 900;
      }

      .copy span {
        overflow: hidden;
        color: var(--soft);
        font-size: 0.76rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .arrow {
        margin-left: auto;
        color: var(--olive);
        font-size: 1.25rem;
      }

      .footer {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 26px;
        color: rgba(114, 119, 110, 0.78);
        font-size: 0.65rem;
        font-weight: 900;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .footer::before {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--gold);
        box-shadow: 0 0 10px rgba(212, 143, 64, 0.7);
        content: "";
      }

      @media (max-width: 680px) {
        .page {
          width: min(100% - 16px, 540px);
          padding: 12px 0;
        }

        .card {
          grid-template-columns: 1fr;
          border-radius: 21px;
        }

        .portrait {
          min-height: 340px;
          background-position: center 30%;
        }

        .content {
          min-height: auto;
          padding: 34px 23px 30px;
        }

        h1 {
          font-size: clamp(3.4rem, 17vw, 5.5rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card" aria-labelledby="page-title">
        <div class="portrait" aria-label="Profile photo">
          <span class="portrait-label">profile</span>
          <span class="portrait-mark" aria-hidden="true"></span>
        </div>

        <div class="content">
          <p class="eyebrow">social links</p>
          <h1 id="page-title">Archie <span>Serrano.</span></h1>
          <div class="line"></div>

          <nav class="links" aria-label="Social links">
            <a
              class="link"
              href="https://m.facebook.com/archiepogiii/"
              target="_blank"
              rel="noreferrer"
            >
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M13.5 21v-8h2.7l.4-3h-3.1V8.1c0-.9.3-1.5 1.5-1.5h1.7V4a22 22 0 0 0-2.5-.1c-2.5 0-4.2 1.5-4.2 4.3V10H7.5v3H10v8h3.5Z"></path>
                </svg>
              </span>
              <span class="copy">
                <strong>Facebook</strong>
                <span>archiepogiii</span>
              </span>
              <span class="arrow" aria-hidden="true">↗</span>
            </a>

            <a
              class="link"
              href="https://www.instagram.com/its_archiveeee/"
              target="_blank"
              rel="noreferrer"
            >
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                  <circle cx="12" cy="12" r="4"></circle>
                  <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle>
                </svg>
              </span>
              <span class="copy">
                <strong>Instagram</strong>
                <span>@its_archiveeee</span>
              </span>
              <span class="arrow" aria-hidden="true">↗</span>
            </a>

            <a
              class="link"
              href="https://www.tiktok.com/@its_archiveeee"
              target="_blank"
              rel="noreferrer"
            >
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M15.2 3c.3 1.8 1.3 3 3.1 3.2v3a7 7 0 0 1-3.1-.8v6.2a5.4 5.4 0 1 1-4.7-5.3v3.1a2.4 2.4 0 1 0 1.6 2.2V3h3.1Z"></path>
                </svg>
              </span>
              <span class="copy">
                <strong>TikTok</strong>
                <span>@its_archiveeee</span>
              </span>
              <span class="arrow" aria-hidden="true">↗</span>
            </a>
          </nav>

          <div class="footer">03 links</div>
        </div>
      </section>
    </main>
  </body>
</html>
